services:
  # Spring Boot Backend Web Service
  - type: web
    name: student-placement-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8083
      - key: DDL_AUTO
        value: update
      - key: CORS_ORIGINS
        value: https://chakradharreddy1606137.github.io,http://localhost:5173,http://localhost:5174
      - key: DB_URL
        fromDatabase:
          name: placement-mysql
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: placement-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: placement-mysql
          property: password
