spring.application.name=placement-management
server.port=${PORT:${SERVER_PORT:8083}}

# Database Configuration (supports local MySQL, Render, Railway, Aiven, TiDB, Supabase)
spring.datasource.url=${DB_URL:${MYSQL_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/placement_management}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:StudentPlacementManagementJwtSecretKey2026SecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,https://chakradharreddy1606137.github.io,http://localhost:8083}

