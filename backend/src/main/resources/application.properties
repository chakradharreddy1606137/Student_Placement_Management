spring.application.name=placement-management
server.port=${SERVER_PORT:8083}

# Database Configuration (override via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# JWT Configuration (override in production with a strong secret)
jwt.secret=${JWT_SECRET:StudentPlacementManagementJwtSecretKey2026SecureKey}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS — comma-separated allowed origins (override in production)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178}
